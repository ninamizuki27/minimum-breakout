<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>最小</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;touch-action:none;font-family:monospace}#field{position:fixed;inset:0;overflow:hidden;background:#050505}#reward{position:absolute;left:0;top:9vh;width:100%;height:56vh;background-size:cover;background-position:center;filter:saturate(.9);opacity:.95}.brick{position:absolute;width:5px;height:5px;background:#111;box-shadow:inset 0 0 0 1px #191919}.brick.hard{background:#222}.brick.core{background:#393939}.ball{position:absolute;width:4px;height:4px;background:#fff;z-index:5}.ball.hot{background:#ff584d;box-shadow:0 0 5px #ff584d}.paddle{position:absolute;height:3px;background:#fff;z-index:6}.hud{position:absolute;top:18px;font-size:13px;z-index:8;text-shadow:0 1px 3px #000}.l{left:16px}.r{right:16px}#tap{position:absolute;left:50%;top:78%;transform:translate(-50%,-50%);font-size:13px;z-index:8}#choice{display:none;position:absolute;inset:0;z-index:20;background:#000b;align-items:center;justify-content:center;gap:10px}.pick{border:1px solid #777;background:#090909;color:#fff;padding:18px 16px;font:12px monospace;min-width:86px}#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}#reveal{display:none;position:absolute;inset:0;z-index:25;background:#000;align-items:center;justify-content:center}#reveal img{width:100%;height:100%;object-fit:cover}#reveal span{position:absolute;bottom:5vh;font-size:12px;text-shadow:0 1px 4px #000}#file{display:none}
</style></head><body><div id="field"><div id="reward"></div><span class="hud l" id="lv">01</span><span class="hud r" id="bc">1</span><span id="tap">tap</span><div class="paddle" id="pad"></div><div id="choice"><button class="pick" data-p="split">分裂</button><button class="pick" data-p="pierce">貫通</button><button class="pick" data-p="speed">加速</button></div><div id="flash"></div><div id="reveal"><img id="full"><span>tap</span></div><input id="file" type="file" accept="image/*"></div><script>
(function(){'use strict';var f=document.getElementById('field'),reward=document.getElementById('reward'),pad=document.getElementById('pad'),tap=document.getElementById('tap'),lv=document.getElementById('lv'),bc=document.getElementById('bc'),choice=document.getElementById('choice'),flash=document.getElementById('flash'),reveal=document.getElementById('reveal'),full=document.getElementById('full'),file=document.getElementById('file');var W=innerWidth,H=innerHeight,pw=50,px=W/2,py=H*.91,level=1,playing=false,last=0,bricks=[],balls=[],destroyed=0,total=1,nextChoice=.24,split=0,pierce=0,speedUp=0,critical=false,finishTimer=0;
var arts=[svg('#10192c','#ffcb67','01'),svg('#29141d','#f36c78','02'),svg('#10251f','#69e3ae','03'),svg('#261a35','#ba8cff','04')];var custom=[];
function svg(a,b,n){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100"><defs><radialGradient id="g"><stop stop-color="'+b+'"/><stop offset="1" stop-color="'+a+'"/></radialGradient></defs><rect width="100%" height="100%" fill="'+a+'"/><circle cx="360" cy="460" r="270" fill="url(#g)"/><circle cx="280" cy="410" r="28" fill="'+a+'"/><circle cx="440" cy="410" r="28" fill="'+a+'"/><path d="M250 555 Q360 650 470 555" fill="none" stroke="'+a+'" stroke-width="22"/><text x="360" y="930" fill="white" opacity=".75" font-family="monospace" font-size="40" text-anchor="middle">MINIMUM '+n+'</text></svg>')}
function art(){return custom.length?custom[(level-1)%custom.length]:arts[(level-1)%arts.length]}
function el(c){var e=document.createElement('div');e.className=c;f.appendChild(e);return e}function pos(e,x,y){e.style.transform='translate('+x+'px,'+y+'px)'}function clear(a){for(var i=0;i<a.length;i++)if(a[i].e&&a[i].e.parentNode)a[i].e.remove();a.length=0}
function stage(){W=innerWidth;H=innerHeight;py=H*.91;pw=Math.max(48,W*.12);px=W/2;pad.style.width=pw+'px';pad.style.top=py+'px';pad.style.left=(px-pw/2)+'px';clear(bricks);clear(balls);destroyed=0;critical=false;finishTimer=0;nextChoice=.24;split=pierce=speedUp=0;var url=art();reward.style.backgroundImage='url("'+url+'")';full.src=url;var step=6,top=H*.09,bottom=H*.65;for(var y=top;y<bottom;y+=step)for(var x=0;x<W;x+=step){var e=el('brick'),r=Math.random(),hp=r<.035?3:1,core=r>.985;e.className='brick'+(core?' core':hp>1?' hard':'');pos(e,x,y);bricks.push({e:e,x:x,y:y,hp:hp,core:core,dead:false})}total=bricks.length;addBall(W/2,py-18,W*.17,-W*.39);lv.textContent=('0'+level).slice(-2);bc.textContent='1';tap.style.display='block';playing=false}
function addBall(x,y,vx,vy){if(balls.length>=700)return;var e=el('ball');balls.push({e:e,x:x,y:y,vx:vx,vy:vy});pos(e,x,y)}
function kill(q){if(q.dead)return;q.dead=true;q.e.remove();destroyed++;if(q.core){for(var i=0;i<bricks.length;i++){var z=bricks[i];if(!z.dead&&Math.hypot(z.x-q.x,z.y-q.y)<48){z.dead=true;z.e.remove();destroyed++}}flash.style.opacity='.22';setTimeout(function(){flash.style.opacity='0'},55)}}
function collision(b){for(var j=0;j<bricks.length;j++){var q=bricks[j];if(q.dead||Math.abs(b.x-q.x)>6||Math.abs(b.y-q.y)>6)continue;q.hp--;if(q.hp<=0)kill(q);else q.e.style.opacity='.45';if(!pierce)b.vy=-b.vy;return true}return false}
function choose(){playing=false;choice.style.display='flex'}function apply(p){if(p==='split'){split++;var copy=balls.slice();for(var i=0;i<copy.length&&balls.length<80;i++){var b=copy[i];addBall(b.x,b.y,-b.vx*.92,b.vy*.98)}}if(p==='pierce')pierce++;if(p==='speed')speedUp++;choice.style.display='none';playing=true}
function triggerCritical(){if(critical)return;critical=true;for(var i=0;i<balls.length;i++)balls[i].e.className='ball hot';var target=Math.min(640,Math.max(120,balls.length*12));var timer=setInterval(function(){var old=balls.slice(),need=Math.min(target-balls.length,Math.max(4,balls.length));for(var i=0;i<need;i++){var b=old[i%old.length],a=(Math.random()-.5)*1.6,s=Math.hypot(b.vx,b.vy)*1.05;addBall(b.x,b.y,Math.sin(a)*s,(Math.random()<.5?-1:1)*Math.abs(Math.cos(a)*s));balls[balls.length-1].e.className='ball hot'}bc.textContent=balls.length;if(balls.length>=target)clearInterval(timer)},90)}
function frame(t){var dt=last?Math.min(.024,(t-last)/1000):0;last=t;if(playing){var mult=1+speedUp*.16;for(var i=balls.length-1;i>=0;i--){var b=balls[i];b.x+=b.vx*dt*mult;b.y+=b.vy*dt*mult;if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}if(b.x>W-4){b.x=W-4;b.vx=-Math.abs(b.vx)}if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+4>=py&&b.y<=py+8&&b.x+4>=px-pw/2&&b.x<=px+pw/2){b.y=py-5;b.vy=-Math.abs(b.vy);b.vx+=(b.x-px)*2}collision(b);pos(b.e,b.x,b.y);if(b.y>H){b.e.remove();balls.splice(i,1)}}bricks=bricks.filter(function(q){return !q.dead});var progress=destroyed/total;if(!critical&&progress>=.78)triggerCritical();if(!critical&&progress>=nextChoice){nextChoice+=.23;choose()}bc.textContent=balls.length;if(destroyed>=total*.995&&finishTimer===0){finishTimer=Date.now();playing=false;clear(balls);pad.style.display='none';setTimeout(function(){reveal.style.display='flex'},250)}if(!balls.length&&!finishTimer){playing=false;tap.style.display='block'}}requestAnimationFrame(frame)}
function move(e){if(e.cancelable)e.preventDefault();if(choice.style.display==='flex'||reveal.style.display==='flex')return;if(!playing){playing=true;tap.style.display='none'}px=Math.max(pw/2,Math.min(W-pw/2,e.clientX));pad.style.left=(px-pw/2)+'px'}f.addEventListener('pointerdown',move,{passive:false});f.addEventListener('pointermove',function(e){if(e.pointerType==='touch'||e.buttons)move(e)},{passive:false});choice.addEventListener('pointerdown',function(e){e.stopPropagation();var p=e.target.getAttribute('data-p');if(p)apply(p)});reveal.addEventListener('pointerdown',function(e){e.stopPropagation();reveal.style.display='none';pad.style.display='block';level++;stage()});
var hold;lv.addEventListener('pointerdown',function(e){e.stopPropagation();hold=setTimeout(function(){file.click()},700)});lv.addEventListener('pointerup',function(){clearTimeout(hold)});file.addEventListener('change',function(){if(!file.files[0])return;var r=new FileReader();r.onload=function(){custom.push(r.result);stage()};r.readAsDataURL(file.files[0])});stage();requestAnimationFrame(frame)})();
</script></body></html>
