<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#000"><title>最小</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;touch-action:none;font-family:monospace}#field{position:fixed;inset:0;background:#000;overflow:hidden}.brick{position:absolute;width:2px;height:2px;background:#ddd}.ball{position:absolute;width:4px;height:4px;background:#fff}.paddle{position:absolute;height:3px;background:#fff}.hud{position:absolute;top:18px;font-size:14px}.l{left:16px}.r{right:16px}#tap{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);font-size:14px}
</style></head><body><div id="field"><span class="hud l" id="lv">1</span><span class="hud r" id="bc">1</span><span id="tap">tap</span><div class="paddle" id="pad"></div></div><script>
(function(){var f=document.getElementById('field'),pad=document.getElementById('pad'),tap=document.getElementById('tap'),lv=document.getElementById('lv'),bc=document.getElementById('bc');var W=innerWidth,H=innerHeight,pw=50,px=W/2,py=H*.91,level=1,playing=false,last=0,bricks=[],balls=[];
function el(c){var e=document.createElement('div');e.className=c;f.appendChild(e);return e}function pos(e,x,y){e.style.transform='translate('+x+'px,'+y+'px)'}
function clear(c){for(var i=0;i<c.length;i++)c[i].e.remove();c.length=0}
function stage(){W=innerWidth;H=innerHeight;py=H*.91;pw=Math.max(48,W*.12);pad.style.width=pw+'px';pad.style.top=py+'px';px=W/2;pad.style.left=(px-pw/2)+'px';clear(bricks);clear(balls);var step=4,top=H*.11,bh=Math.min(H*.25+level*5,H*.48);for(var y=top;y<top+bh;y+=step)for(var x=0;x<W;x+=step)if(Math.random()<Math.min(.92,.62+level*.025)){var e=el('brick');pos(e,x,y);bricks.push({e:e,x:x,y:y,dead:false})}addBall(W/2,py-18,W*.20,-W*.43);lv.textContent=level;bc.textContent=1}
function addBall(x,y,vx,vy){var e=el('ball');balls.push({e:e,x:x,y:y,vx:vx,vy:vy});pos(e,x,y)}
function frame(t){var dt=last?Math.min(.025,(t-last)/1000):0;last=t;if(playing){for(var i=balls.length-1;i>=0;i--){var b=balls[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<0){b.x=0;b.vx=Math.abs(b.vx)}if(b.x>W-4){b.x=W-4;b.vx=-Math.abs(b.vx)}if(b.y<0){b.y=0;b.vy=Math.abs(b.vy)}if(b.vy>0&&b.y+4>=py&&b.y<=py+8&&b.x+4>=px-pw/2&&b.x<=px+pw/2){b.y=py-5;b.vy=-Math.abs(b.vy);b.vx+=(b.x-px)*2}for(var j=0;j<bricks.length;j++){var q=bricks[j];if(!q.dead&&Math.abs(b.x-q.x)<4&&Math.abs(b.y-q.y)<4){q.dead=true;q.e.remove();b.vy=-b.vy;if(Math.random()<.055&&balls.length<120)addBall(b.x,b.y,-b.vx*.9,b.vy);break}}pos(b.e,b.x,b.y);if(b.y>H){b.e.remove();balls.splice(i,1)}}bricks=bricks.filter(function(q){return !q.dead});bc.textContent=balls.length;if(!bricks.length){level++;stage();playing=true}if(!balls.length){playing=false;tap.style.display='block'}}requestAnimationFrame(frame)}
function move(e){if(e.cancelable)e.preventDefault();if(!playing){playing=true;tap.style.display='none'}px=Math.max(pw/2,Math.min(W-pw/2,e.clientX));pad.style.left=(px-pw/2)+'px'}f.addEventListener('pointerdown',move,{passive:false});f.addEventListener('pointermove',function(e){if(e.pointerType==='touch'||e.buttons)move(e)},{passive:false});stage();requestAnimationFrame(frame)})();
</script></body></html>
